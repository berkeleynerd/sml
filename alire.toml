name = "sml"
description = "Simple XML library for Ada/SPARK"
version = "0.1.0-dev"

authors = ["Your Name"]
maintainers = ["Your Name <example@example.com>"]
licenses = "MIT OR Apache-2.0 WITH LLVM-exception"
website = ""
tags = ["xml", "parser", "simple-xml", "spark"]


[build-switches]
"*".ada_version = "Ada2022"
"*".runtime_checks = "Overflow"
"*".style_checks = [
  "-gnaty3",      # indentation 3
  "-gnatyM120",   # max width 120
  "-gnatyB",      # short-circuit bools
  "-gnatyl",      # layout
  "-gnatya",      # attribute casing
  "-gnatyO"       # explicit overriding
]

# Alire test actions: build and run omnibus tests
[[actions]]
type = "test"
name = "build-tests"
command = ["alr", "exec", "--", "gprbuild", "-p", "-P", "test/test_all.gpr", "-j0"]

[[actions]]
type = "test"
name = "run-tests"
command = ["bin/test_all"]
